<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Salesforce Data Quality Scanner</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">FIRST POC · HUMAN REVIEW REQUIRED</p><h1>Salesforce data quality scanner</h1><p class="subtitle">Coverage-aware findings from a repeatable scan snapshot.</p></div><button id="demo">Run demo scan</button></header>
    <section class="upload"><strong>Scan a CSV export</strong><form id="upload"><label>Object <input name="object_name" value="Opportunity" required></label><label>CSV <input name="file" type="file" accept=".csv" required></label><button>Upload and scan</button></form><p id="message" role="status"></p></section>
    <section id="stats" class="stats"></section>
    <section id="coverage"></section>
    <section class="panel"><div class="panel-title"><h2>Review queue</h2><span id="findingCount"></span></div><div id="findingTypes" class="type-breakdown"></div><div id="findings" class="findings"><p>Run a scan to populate the review queue.</p></div></section>
    <section class="panel"><h2>Recent scans</h2><div id="scans"></div></section>
  </main>
  <template id="findingTemplate"><article class="finding"><div class="finding-head"><span class="badge"></span><h3></h3><span class="type-tag"></span><span class="score"></span></div><p class="record"></p><p class="why"></p><details><summary>Evidence and provenance</summary><pre></pre></details><div class="actions"><button data-label="real_issue">Real issue</button><button data-label="false_positive">False positive</button><button data-label="valid_exception">Valid exception</button><button data-label="needs_review">Needs review</button></div></article></template>
  <script src="/static/app.js"></script>
</body>
</html>
